<!doctype html>
<html lang="fr" data-typo="fraunces">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fun facts</title>
<meta name="description" content="Un terrier de faits vérifiés : chaque réponse ouvre deux nouvelles pistes.">
<meta name="theme-color" content="#15131A">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23FF5A36'/%3E%3Ctext x='16' y='23' font-family='Arial Black,Arial' font-weight='900' font-size='18' text-anchor='middle' fill='%2315131A'%3E%3F%3C/text%3E%3C/svg%3E">
<link rel="preload" href="fonts/fraunces.woff" as="font" type="font/woff" crossorigin>

<link rel="stylesheet" href="jeu.css">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
</head>
<body>
<header class="hud" id="hud">
  <span class="marque">fun facts</span>
  <div class="hud-droite">
    <button class="puce" id="btn-niveau" type="button" aria-label="Niveau"><span id="niv">Niv. 1</span><span class="niv-nom" id="niv-nom">Curieux</span></button>
    <span class="puce serie" id="serie" hidden aria-live="polite"></span>
    <button class="puce" id="btn-pistes" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19c3-1 4-4 7-7s6-4 7-7" /><circle cx="5" cy="19" r="2.2" /><circle cx="19" cy="5" r="2.2" /></svg><span id="nb-pistes">0</span></button>
    <button class="puce" id="btn-collection" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5" /><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5" /><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5" /><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5" /></svg><span id="nb-trouves">0/0</span></button>
    <button class="puce icone" id="btn-typo" type="button" aria-label="Changer la typo" title="Changer la typo">Aa</button>
    <button class="puce icone" id="btn-son" type="button" aria-label="Couper le son" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" /><path class="onde" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" /></svg></button>
  </div>
  <div class="xp" aria-hidden="true"><div class="xp-barre" id="xp-barre"></div></div>
</header>
<main id="fil" class="fil"></main>
<dialog id="dlg-collection" class="tiroir"></dialog>
<dialog id="dlg-pistes" class="tiroir"></dialog>
<dialog id="dlg-fiche" class="tiroir"></dialog>
<div id="annonce" class="annonce" hidden></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<noscript><p style="padding:80px 18px">Ce site a besoin de JavaScript.</p></noscript>
<script type="module" src="js/jeu.js"></script>
</body>
</html>
