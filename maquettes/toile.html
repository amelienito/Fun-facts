:root {
  --fond: #dde6ea; --point: #b3c3cb; --encre: #14183a;
  --tomate: #ff5e3a; --cobalt: #2440ff; --pistache: #a6d86b; --rose: #ff9ac8; --soleil: #ffc83d;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; color: var(--encre);
  font-family: "Hanken", system-ui, sans-serif; -webkit-font-smoothing: antialiased;
  background: radial-gradient(circle, var(--point) 1.2px, transparent 1.6px) 0 0 / 26px 26px, var(--fond);
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--encre); outline-offset: 4px; }

#vue { position: fixed; inset: 0; touch-action: none; cursor: grab; }
#vue.tire { cursor: grabbing; }
#monde { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
#monde.anime { transition: transform 0.9s cubic-bezier(0.6, 0.02, 0.2, 1); }
svg.fils { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
svg.fils path { fill: none; stroke: var(--encre); stroke-width: 2.2; stroke-linecap: round; }
svg.fils path.fantome { stroke-dasharray: 2 9; opacity: 0.45; }

.noeud {
  position: absolute; transform: translate(-50%, -50%);
  width: min(88vw, 400px); padding: 62px 13% 64px;
  background: var(--c); color: var(--t, var(--encre));
  transition: transform 0.5s cubic-bezier(0.3, 1.5, 0.5, 1), opacity 0.4s;
}
.noeud.apparait { transform: translate(-50%, -50%) scale(0.2); opacity: 0; }
.noeud h2:focus { outline: none; }
.noeud h2 {
  margin: 0; font-family: "Syne", sans-serif; font-weight: 800;
  font-size: clamp(1.45rem, 5.6vw, 1.9rem); line-height: 1.08; letter-spacing: -0.01em; text-wrap: balance;
}
.noeud .corps { margin-top: 14px; font-size: 1.05rem; line-height: 1.45; }
.noeud .corps p { margin: 0 0 0.75em; }
.noeud .verdict { font-family: "Syne", sans-serif; font-weight: 800; font-size: 1.15rem; }
.noeud .src { font-size: 0.88rem; opacity: 0.85; }
.noeud .src a { font-weight: 700; }

.sat {
  position: absolute; transform: translate(-50%, -50%);
  width: 92px; height: 92px; border-radius: 50%;
  display: grid; place-items: center; text-align: center; padding: 8px;
  font-family: "Syne", sans-serif; font-weight: 800; font-size: 1.15rem; line-height: 1.05;
  background: var(--fond); border: 2.5px solid var(--encre);
  transition: transform 0.25s cubic-bezier(0.3, 1.6, 0.5, 1), opacity 0.3s, background 0.2s;
}
.sat.petit { width: 108px; height: 108px; font-size: 0.85rem; font-weight: 700; }
.sat:hover { transform: translate(-50%, -50%) scale(1.08); }
.sat.bon { background: var(--encre); color: var(--fond); }

@media (prefers-reduced-motion: reduce) { #monde.anime, .noeud, .porte, .sat { transition: none; } }

<script>
const FAITS = [{"id":"cachalot","nom":"Maquette de cachalot","objet":"cachalot","porte":"Un géant des mers, et un malentendu","q":{"type":"qcm","texte":"Comment dit-on « cachalot » en anglais ?","choix":["Sperm whale","Killer whale","Pilot whale","Humpback whale"],"reponse":0,"explication":"Sperm whale. Les baleiniers prenaient le spermaceti, une substance huileuse contenue dans la tête de l'animal, pour du sperme. Le nom est resté."},"saviez":null,"note":null,"sources":[{"nom":"Encyclopædia Britannica","titre":"How Did the Sperm Whale Get Its Name?","url":"https://www.britannica.com/story/how-did-the-sperm-whale-get-its-name"}],"liens":[]},{"id":"droste","nom":"Boîte de cacao à l'infini","objet":"boite","porte":"Une image dans une image dans une image","q":{"type":"vf","texte":"L'effet Droste, cette image qui se répète à l'intérieur d'elle-même, doit son nom à une marque de cacao.","reponse":true,"explication":"Les boîtes de cacao Droste montraient une infirmière portant un plateau avec une tasse et une boîte identique, sur laquelle on retrouvait la même scène, et ainsi de suite. L'image date du début du XXe siècle ; le terme « effet Droste » a été popularisé à la fin des années 1970 par le chroniqueur néerlandais Nico Scheepmaker."},"saviez":"Giotto avait eu l'idée six siècles plus tôt : sur le triptyque Stefaneschi (début du XIVe siècle), le cardinal Stefaneschi est représenté en train d'offrir… le triptyque lui-même.","note":null,"sources":[{"nom":"Wikipédia (en)","titre":"Droste effect","url":"https://en.wikipedia.org/wiki/Droste_effect"},{"nom":"Aleteia","titre":"How a Dutch cocoa tin was inspired by a medieval altarpiece","url":"https://aleteia.org/2017/12/13/how-a-dutch-cocoa-tin-was-inspired-by-a-medieval-altarpiece/"}],"liens":[{"vers":"bosch","porte":"Un autre détail caché dans un tableau"}]},{"id":"bosch","nom":"Le Jardin des délices (copie)","objet":"tableau:jardin","porte":"Un détail que personne ne regarde","q":{"type":"vf","texte":"Dans Le Jardin des délices de Jérôme Bosch, une partition est peinte sur les fesses d'un personnage.","reponse":true,"explication":"Sur le panneau de l'Enfer, en bas à gauche, un damné porte une portée musicale sur le postérieur. Une étudiante américaine l'a transcrite et enregistrée, et le morceau a fait le tour d'Internet en 2014."},"saviez":null,"note":"Cette transcription est contestée : certains spécialistes de la musique ancienne estiment que la notation peinte par Bosch ne peut pas vraiment être déchiffrée.","sources":[{"nom":"Open Culture","titre":"Listen to a Recording of a Song Written on a Man's Butt in a Hieronymus Bosch Painting","url":"https://www.openculture.com/2014/02/song-written-on-mans-butt-in-bosch-painting.html"}],"liens":[{"vers":"bocklin","porte":"Un autre tableau qui hante les esprits"}]},{"id":"beksinski","nom":"Toile sans titre","objet":"tableau:beksinski","porte":"Des tableaux qui ne disent pas leur nom","q":{"type":"vf","texte":"Le peintre polonais Zdzisław Beksiński refusait de donner un titre à ses tableaux.","reponse":true,"explication":"Il ne nommait aucun de ses dessins ni de ses tableaux : selon lui, ses œuvres n'avaient pas à être expliquées. Il disait ne pas savoir lui-même ce qu'elles signifiaient, et ne pas s'intéresser aux interprétations."},"saviez":"Né en 1929 à Sanok, dans le sud de la Pologne, et mort en 2005 à Varsovie, il résumait sa démarche ainsi : « Je ne veux rien dire ni rien transmettre. Je peins simplement ce qui me vient à l'esprit. »","note":null,"sources":[{"nom":"Wikipédia (en)","titre":"Zdzisław Beksiński","url":"https://en.wikipedia.org/wiki/Zdzis%C5%82aw_Beksi%C5%84ski"}],"liens":[{"vers":"bocklin","porte":"Un autre paysage de fin du monde"}]},{"id":"bocklin","nom":"L'Île des morts (copie)","objet":"tableau:ile","porte":"Une île, un rameur, des cyprès","q":{"type":"vf","texte":"Arnold Böcklin n'a peint qu'une seule version de L'Île des morts.","reponse":false,"explication":"Il en a peint cinq, entre 1880 et 1886. Une sixième , et Katerine a accepté justement parce qu'il s'agissait d'une prostate."},"saviez":"Réalisé par Marco Nguyen et Nicolas Athané, Jim Queen suit un influenceur de la nuit gay parisienne qui contracte « l'hétérose », un virus qui rend les homosexuels hétérosexuels. Le film a été présenté au Festival de Cannes.","note":null,"sources":[{"nom":"Le Petit Septième","titre":"[Cannes] Jim Queen : Queentastic","url":"https://lepetitseptieme.ca/en/2026/05/20/cannes-jim-queen-queentastic/"},{"nom":"Politis","titre":"« Jim Queen », une prostate salutaire","url":"https://www.politis.fr/articles/2026/06/cinema-nguyen-athane-jim-queen-une-prostate-salutaire/"}],"liens":[{"vers":"quebec","porte":"Un titre de film très direct"}]},{"id":"cage","nom":"Bobine de film","objet":"bobine","porte":"Une histoire de famille à Hollywood","q":{"type":"vf","texte":"Nicolas Cage est le neveu de Francis Ford Coppola.","reponse":true,"explication":"Son père, August Coppola, est le frère de Francis Ford Coppola. Nicolas Cage est donc le cousin germain de la réalisatrice Sofia Coppola. Il est né Nicolas Coppola."},"saviez":null,"note":null,"sources":[{"nom":"Encyclopædia Britannica","titre":"How Is Sofia Coppola Related to Nicolas Cage?","url":"https://www.britannica.com/question/How-is-Sofia-Coppola-related-to-Nicolas-Cage"},{"nom":"Encyclopædia Britannica","titre":"Nicolas Cage","url":"https://www.britannica.com/biography/Nicolas-Cage"}],"liens":[{"vers":"trump","porte":"Un autre visage connu, là où on ne l'attend pas"}]},{"id":"trump","nom":"Cassette vidéo","objet":"vhs","porte":"Une apparition éclair dans un film de Noël","q":{"type":"vf","texte":"Donald Trump fait une apparition dans Maman, j'ai encore raté l'avion (1992).","reponse":true,"explication":"Il croise brièvement Kevin dans le hall de l'hôtel Plaza, qui lui appartenait à l'époque. Le réalisateur Chris Columbus a raconté que cette apparition était la condition pour pouvoir tourner dans l'hôtel."},"saviez":"Il fait aussi des apparitions dans Zoolander, Le Prince de Bel-Air et Sex and the City.","note":null,"sources":[{"nom":"South China Morning Post","titre":"Donald Trump's most memorable appearances in TV and film","url":"https://scmp.com/magazines/style/entertainment/article/3265462/donald-trumps-most-memorable-appearances-tv-and-film-sex-and-city-fresh-prince-bel-air-and-nanny"},{"nom":"The Irish Post","titre":"Home Alone 2 director says Donald Trump bullied his way into movie","url":"https://www.irishpost.com/news/home-alone-2-director-says-donald-trump-bullied-his-way-into-movie-197727"}],"liens":[{"vers":"cage","porte":"Une autre histoire de cinéma"}]},{"id":"tumbler","nom":"Boule de feu à pointes","objet":"boulefeu","porte":"Quelques millisecondes dans le désert du Nevada","q":{"type":"vf","texte":"Sur certaines photos d'essais nucléaires, des pointes sortent de la boule de feu à cause de simples câbles.","reponse":true,"explication":"C'est l'« effet rope trick ». La lumière intense de la boule de feu chauffe les haubans qui tiennent la tour de tir : ils se vaporisent et forment ces pointes. Il a été photographié notamment lors de l'opération Tumbler-Snapper, au Nevada, en 1952."},"saviez":"Ces images ont été prises avec des caméras rapatronic, conçues notamment par Harold Edgerton. Chaque caméra ne prenait qu'une seule photo, avec une exposition d'environ trois microsecondes : il fallait en aligner plusieurs pour obtenir une séquence.","note":"Le physicien John Malik, qui a nommé l'effet, a montré que des câbles peints en noir l'accentuaient, et que de la peinture réfléchissante ou de l'aluminium le faisaient disparaître.","sources":[{"nom":"Wikipédia (en)","titre":"Rope trick effect","url":"https://en.wikipedia.org/wiki/Rope_trick_effect"},{"nom":"Atomic Archive","titre":"Early Fireball","url":"https://www.atomicarchive.com/media/photographs/fireball/fireball-4.html"}],"liens":[{"vers":"femto","porte":"Des temps encore plus courts"}]},{"id":"femto","nom":"Chronomètre de précision","objet":"chrono","porte":"Une durée presque impossible à imaginer","q":{"type":"qcm","texte":"Une femtoseconde, c'est…","choix":["10⁻⁹ seconde","10⁻¹² seconde","10⁻¹⁵ seconde","10⁻¹⁸ seconde"],"reponse":2,"explication":"10⁻¹⁵ seconde, soit un millionième de milliardième de seconde. 10⁻⁹, c'est la nanoseconde, 10⁻¹² la picoseconde et 10⁻¹⁸ l'attoseconde."},"saviez":"Les préfixes « femto » et « atto » ont été ajoutés au Système international d'unités en 1964.","note":null,"sources":[{"nom":"BIPM (Bureau international des poids et mesures)","titre":"SI prefixes","url":"https://www.bipm.org/en/measurement-units/si-prefixes"},{"nom":"BIPM","titre":"Résolution 8 de la 12e Conférence générale des poids et mesures (1964)","url":"https://www.bipm.org/en/committees/cg/cgpm/12-1964/resolution-8"}],"liens":[]},{"id":"eigengrau","nom":"Nuancier du noir","objet":"livre:gris","porte":"La couleur du noir complet","q":{"type":"vf","texte":"Dans l'obscurité totale, l'œil voit un noir parfait.","reponse":false,"explication":"Il voit un gris très foncé, appelé eigengrau (« gris intrinsèque » en allemand). Même sans lumière, le nerf optique continue de transmettre des signaux : une sorte de bruit de fond visuel."},"saviez":"Un ciel nocturne paraît plus noir que l'eigengrau : les étoiles créent du contraste, et c'est le contraste qui guide notre perception.","note":null,"sources":[{"nom":"Vice","titre":"Quelle couleur voit-on dans le noir total ? L'eigengrau, évidemment","url":"https://www.vice.com/fr/article/quelle-couleur-voit-on-dans-le-noir-total-leigengrau-evidemment/"}],"liens":[]},{"id":"coucou","nom":"Nid avec un œuf de trop","objet":"nid","porte":"Un oiseau qui ne fait pas le travail lui-même","q":{"type":"vf","texte":"Le coucou gris couve lui-même ses œufs.","reponse":false,"explication":"Le coucou gris est un parasite de couvée : la femelle pond dans le nid d'autres espèces d'oiseaux, qui couvent l'œuf puis nourrissent le poussin comme s'il était le leur."},"saviez":null,"note":null,"sources":[{"nom":"INPN (Muséum national d'Histoire naturelle)","titre":"Cuculus canorus, coucou gris","url":"https://inpn.mnhn.fr/espece/cd_nom/3465"}],"liens":[{"vers":"hiboux","porte":"Un autre oiseau qui cache bien son jeu"}]},{"id":"hiboux","nom":"Hibou perché","objet":"hibou","porte":"Ce que cachent les plumes","q":{"type":"vf","texte":"Les hiboux ont de longues pattes, cachées sous leurs plumes.","reponse":true,"explication":"Ce qu'on voit d'un hibou, c'est surtout le bas de la patte et les serres : la cuisse et le genou sont cachés dans le plumage. Ces longues pattes servent à chasser : le hibou attrape ses proies avec les serres, ce qui garde sa tête et ses yeux à distance."},"saviez":"La chouette lapone ne pèse qu'environ 1,4 kg, mais elle pourrait percer une croûte de neige assez solide pour supporter une personne de 80 kg.","note":null,"sources":[{"nom":"American Bird Conservancy","titre":"Why Are Owl Legs So Long?","url":"https://abcbirds.org/news/why-are-owl-legs-so-long-the-science-behind-those-lengthy-bird-limbs/"}],"liens":[]},{"id":"zoubida","nom":"45 tours de 1991","objet":"vinyle:rose","porte":"Le tube de l'été 1991","q":{"type":"vf","texte":"La Zoubida de Lagaf' a été certifiée disque de platine.","reponse":true,"explication":"Sortie en mai 1991, la chanson a été certifiée disque de platine par le SNEP. Elle est restée onze semaines, non consécutives, en tête du classement français des singles."},"saviez":null,"note":null,"sources":[{"nom":"Wikipédia (en)","titre":"La Zoubida","url":"https://en.wikipedia.org/wiki/La_Zoubida"}],"liens":[{"vers":"around","porte":"Une autre chanson répétitive"}]},{"id":"around","nom":"Vinyle de Homework","objet":"vinyle:bleu","porte":"Une chanson de trois mots","q":{"type":"qcm","texte":"Combien de fois la phrase « Around the world » est-elle répétée dans le morceau de Daft Punk ?","choix":["44 fois","88 fois","144 fois","200 fois"],"reponse":2,"explication":"144 fois, selon le décompte le plus souvent cité pour la version de l'album Homework (1997). Ce sont les seules paroles du morceau."},"saviez":null,"note":"Les décomptes varient légèrement selon les versions (single, album, montage radio). 144 correspond à la version album.","sources":[{"nom":"Songfacts","titre":"Around The World by Daft Punk","url":"https://www.songfacts.com/facts/daft-punk/around-the-world"}],"liens":[]},{"id":"farriner","nom":"Miche de Pudding Lane","objet":"pain","porte":"Une boulangerie, une nuit de septembre","q":{"type":"vf","texte":"Le Grand Incendie de Londres, en 1666, est parti d'une boulangerie.","reponse":true,"explication":"Le feu démarre dans la boulangerie de Thomas Farriner, sur Pudding Lane. Ce boulanger était connu pour avoir fourni du pain à la Royal Navy."},"saviez":"Un horloger français, Robert Hubert, avoue avoir allumé l'incendie. Farriner et ses enfants signent l'acte d'accusation, et Hubert est pendu le 27 octobre 1666. Pourtant, le capitaine de son navire témoigne qu'il n'est arrivé en Angleterre que deux jours après le début du feu. Farriner meurt en 1670.","note":"Le rôle de Farriner dans l'accusation repose sur une transcription d'archives de la City de Londres, citée par la page Wikipédia qui lui est consacrée.","sources":[{"nom":"British Library","titre":"Robert Hubert and the Great Fire of London","url":"https://www.bl.uk/stories/blogs/posts/robert-hubert-and-the-great-fire-of-london"},{"nom":"Wikipédia (en)","titre":"Thomas Farriner","url":"https://en.wikipedia.org/wiki/Thomas_Farriner"}],"liens":[]},{"id":"melos","nom":"Colonne de Mélos","objet":"colonne","porte":"Une île qui voulait rester neutre","q":{"type":"vf","texte":"Au Ve siècle av. J.-C., Athènes a rasé une île parce qu'elle voulait rester neutre.","reponse":true,"explication":"En 416 av. J.-C., Athènes somme l'île de Mélos de se soumettre. Les Méliens refusent, plaident la neutralité et en appellent à la justice. Athènes assiège l'île, tue les hommes et réduit les femmes et les enfants en esclavage."},"saviez":"Thucydide reconstitue la négociation dans le « dialogue mélien ». Les Athéniens y expliquent que la justice ne vaut qu'entre égaux : les forts font ce qu'ils peuvent, les faibles subissent ce qu'ils doivent. Le texte est encore étudié en relations internationales.","note":"Selon Thucydide, Mélos était une colonie fondée par Sparte, ce qui explique la méfiance d'Athènes. Une île, donc, et non Sparte elle-même.","sources":[{"nom":"Encyclopædia Britannica","titre":"Melian Dialogue","url":"https://www.britannica.com/topic/Melian-Dialogue"},{"nom":"Thucydide","titre":"La Guerre du Péloponnèse, livre V, chapitres 84 à 116","url":null}],"liens":[]},{"id":"cerveau","nom":"Cerveau en bocal","objet":"cerveau","porte":"L'organe le plus gourmand du corps","q":{"type":"vf","texte":"On n'utilise que 10 % de notre cerveau.","reponse":false,"explication":"Les neurologues interrogés par Scientific American sont formels : on utilise pratiquement toutes les parties du cerveau. L'imagerie montre que la plupart des régions sont actives au cours d'une journée, même pendant le sommeil."},"saviez":"Le cerveau représente environ 3 % du poids du corps, mais il consomme environ 20 % de son énergie. L'origine du mythe reste floue : on la rattache parfois aux écrits du psychologue William James, et on l'attribue aussi à Einstein, sans preuve.","note":null,"sources":[{"nom":"Scientific American","titre":"Do People Only Use 10 Percent of Their Brains?","url":"https://www.scientificamerican.com/article/do-people-only-use-10-percent-of-their-brains/"}],"liens":[]},{"id":"requins","nom":"Dent de requin fossile","objet":"dent","porte":"Un prédateur très, très ancien","q":{"type":"vf","texte":"Les requins existent depuis plus longtemps que les arbres.","reponse":true,"explication":"Les plus anciennes traces de requins sont des écailles vieilles d'environ 450 millions d'années. La plus ancienne forêt fossile connue, découverte à Cairo, dans l'État de New York, a environ 386 millions d'années."},"saviez":"Cette forêt fossile a été retrouvée dans une ancienne carrière de grès des monts Catskill. On y distingue encore les systèmes racinaires de ces arbres primitifs.","note":"Les écailles de 450 millions d'années font débat : on ne sait pas avec certitude s'il s'agit de vrais requins. Mais même les plus vieilles dents de type requin connues, celles de Doliodus problematicus (environ 410 millions d'années), sont plus anciennes que cette forêt.","sources":[{"nom":"Natural History Museum, Londres","titre":"Shark evolution: a 450-million-year timeline","url":"https://www.nhm.ac.uk/discover/shark-evolution-a-450-million-year-timeline"},{"nom":"Yale Environment 360","titre":"Scientists Find the World's Oldest Known Forest, Dating Back 386 Million Years (étude parue dans Current Biology, 2019)","url":"https://e360.yale.edu/digest/scientists-find-the-worlds-oldest-known-forest-dating-back-386-million-years"}],"liens":[]}];
const par = Object.fromEntries(FAITS.map((f) => [f.id, f]));

const $ = (id) => document.getElementById(id);
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const melange = (a) => a.map((x) => [Math.random(), x]).sort((p, q) => p[0] - q[0]).map((p) => p[1]);

const monde = $("monde"), fils = $("fils");

function appliquer(anime) {
  monde.classList.toggle("anime", !!anime && !reduit);

}
function viser(x, y, s = 1, haut = false) {
  cam.s = s;
  cam.x = innerWidth / 2 - x * s;
  cam.y = (haut ? 90 : innerHeight / 2) - y * s;

}
function fil(x1, y1, x2, y2, fantome) {
  const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
  const mx = (x1 + x2) / 2 + (Math.random() - 0.5) * 120, my = (y1 + y2) / 2;

function teinte(e, k) {

}

function poserFait(id, x, y, k) {

  const H = n.offsetHeight, W = n.offsetWidth;
  boites.push({ x, y, w: W, h: H, n });
  // réponses en satellites, autour du fait
  const opts = f.q.type === "vf" ? [["Vrai", true], ["Faux", false]] : f.q.choix.map((c, j) => [c, j]);
  const sats = opts.map(([lib, val], j) => {
    // les réponses pendent sous le fait, comme des fruits
    const deux = opts.length === 2;
    const sx = x + (deux ? (j ? 1 : -1) * Math.min(W * 0.26, 96) : (j % 2 ? 1 : -1) * 62);
    const sy = y + H / 2 + (deux ? 46 : 52 + Math.floor(j / 2) * 116) + (j % 2 ? 10 : 0);
    const b = el("button", "sat" + (opts.length > 2 ? " petit" : ""), lib);
    b.type = "button"; b.style.left = sx + "px"; b.style.top = sy + "px";
    b.onclick = () => repondre(f, n, sats, val, x, y, k);
    b.dataset.v = String(val);
    monde.append(b);
    return b;
  });
  viser(x, y + (opts.length > 2 ? 150 : 60));
  setTimeout(() => h.focus({ preventScroll: true }), 300);
}

function repondre(f, n, sats, val, x, y, k) {
  if (n.dataset.fini) return;
  n.dataset.fini = "1";
  const juste = val === f.q.reponse;
  for (const b of sats) {
    const v = b.dataset.v === "true" ? true : b.dataset.v === "false" ? false : Number(b.dataset.v);
    b.disabled = true;
    if (v === f.q.reponse) b.classList.add("bon"); else b.classList.add("parti");
  }
  const corps = el("div", "corps");
  corps.append(el("p", "verdict", juste ? "Bien vu." : "Raté."), el("p", null, f.q.explication));
  if (f.saviez) corps.append(el("p", null, "Le saviez-vous ? " + f.saviez));
  if (f.note) corps.append(el("p", "src", "Note de vérification : " + f.note));
  const src = el("p", "src", "Sources : ");
  f.sources.forEach((s, j) => src.append(s.url ? Object.assign(el("a", null, s.nom), { href: s.url, target: "_blank", rel: "noopener" }) : el("span", null, s.nom), document.createTextNode(j < f.sources.length - 1 ? ", " : ".")));
  corps.append(src);
  const h0 = n.offsetHeight;
  n.append(corps);
  // forme plus haute : dômes en haut et en bas, pour que le texte reste dans la tache
  n.style.borderRadius = "46% 54% 42% 58% / 150px 180px 160px 140px";
  const H = n.offsetHeight;
  // le fait grandit vers le bas : on garde son haut en place
  const nouveauY = y + (H - h0) / 2;
  n.style.top = nouveauY + "px";
  const bonne = sats.find((b) => b.classList.contains("bon"));
  if (bonne) bonne.style.top = parseFloat(bonne.style.top) + (H - h0) + "px";
  const nb = vus.length;
  $("compte").textContent = `${nb} fil${nb > 1 ? "s" : ""} tiré${nb > 1 ? "s" : ""}`;
  viser(x, y - h0 / 2, 1, true);
  // deux portes vers la suite
  const reste = FAITS.filter((z) => !vus.includes(z.id));
  const choix = [];
  for (const l of f.liens) { const c = reste.find((z) => z.id === l.vers); if (c && choix.length < 2) choix.push([c, l.porte]); }
  for (const c of melange(reste)) { if (choix.length >= 2) break; if (!choix.some((r) => r[0].id === c.id)) choix.push([c, c.porte]); }
  const basY = nouveauY + H / 2;
  const btn = $("suite");
  btn.hidden = false;
  btn.onclick = () => { viser(x, basY + 170); btn.hidden = true; };
  const dec = Math.min(innerWidth * 0.26, 200);
  const portes = choix.map(([c, lib], j) => {
    const px = x + (j === 0 ? -dec : dec) + (Math.random() - 0.5) * 30;
    const py = basY + 150 + j * 40;
    const fl = fil(x + (j === 0 ? -40 : 40), basY - 10, px, py - 50, false);
    const p = el("button", "porte apparait", lib);
    p.type = "button";
    teinte(p, k + 1 + j);
    p.style.left = px + "px"; p.style.top = py + "px";
    monde.append(p);
    setTimeout(() => p.classList.remove("apparait"), 350 + j * 140);
    p.onclick = () => {
      $("suite").hidden = true;
      portes.forEach((o) => { o.p.disabled = true; if (o.p !== p) { o.p.classList.add("fantome"); o.fl.classList.add("fantome"); } else o.p.style.opacity = 0; });
      poserFait(c.id, px, py + 170, k + 1 + j);
    };
    return { p, fl };
  });
}

// glisser pour se promener dans la toile
let glisse = null;
$("vue").addEventListener("pointerdown", (e) => {
  if (e.target.closest("button, a")) return;
  glisse = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y };
  $("vue").classList.add("tire");
  $("vue").setPointerCapture(e.pointerId);
});
$("vue").addEventListener("pointermove", (e) => {
  if (!glisse) return;
  cam.x = glisse.cx + e.clientX - glisse.x; cam.y = glisse.cy + e.clientY - glisse.y;
  appliquer(false);
});
const lacher = () => { glisse = null; $("vue").classList.remove("tire"); };
$("vue").addEventListener("pointerup", lacher);
$("vue").addEventListener("pointercancel", lacher);
addEventListener("wheel", (e) => { cam.x -= e.deltaX; cam.y -= e.deltaY; appliquer(false); }, { passive: true });

$("voir").onclick = () => {
  const els = [...monde.querySelectorAll(".noeud, .porte, .sat")];
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const e of els) {
    const x = parseFloat(e.style.left), y = parseFloat(e.style.top), w = e.offsetWidth / 2, h = e.offsetHeight / 2;
    x0 = Math.min(x0, x - w); x1 = Math.max(x1, x + w); y0 = Math.min(y0, y - h); y1 = Math.max(y1, y + h);
  }
  const s = Math.min(1, (innerWidth - 40) / (x1 - x0), (innerHeight - 120) / (y1 - y0));
  viser((x0 + x1) / 2, (y0 + y1) / 2, s);
};

poserFait(melange(["cachalot", "quebec", "droste", "eigengrau", "katerine"])[0], 0, 0, 0);
</script>
