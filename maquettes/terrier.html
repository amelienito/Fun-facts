:root { --encre: #000; }
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  font-family: "Bricolage", system-ui, sans-serif;
  font-variation-settings: "opsz" 14;
  color: var(--encre);
  background: #000;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 3px solid currentColor; outline-offset: 4px; }

.coin {
  position: fixed; z-index: 5; top: 0; left: 0; right: 0;
  display: flex; justify-content: space-between; align-items: baseline;
  padding: max(14px, env(safe-area-inset-top)) 18px 0;
  pointer-events: none; mix-blend-mode: difference; color: #fff;
}
.coin * { pointer-events: auto; }
.marque { font-weight: 800; font-size: 1.05rem; letter-spacing: -0.02em; font-stretch: 80%; }
.trouves { font-size: 1rem; font-weight: 500; text-decoration: underline; text-underline-offset: 4px; }

.bande {
  min-height: 100svh;
  padding: 72px max(18px, calc((100% - 920px) / 2)) 64px;
  background: var(--fond);
  color: var(--texte);
}
.fait {
  margin: 0;
  font-weight: 760;
  font-stretch: 76%;
  font-variation-settings: "opsz" 96;
  font-size: clamp(2.5rem, 10.5vw, 6.2rem);
  line-height: 0.93;
  letter-spacing: -0.025em;
  text-wrap: balance;
}
.choix {
  margin: 0.5em 0 0;
  font-weight: 760;
  font-stretch: 76%;
  font-variation-settings: "opsz" 96;
  font-size: clamp(2.1rem, 8vw, 4.6rem);
  line-height: 1.02;
  letter-spacing: -0.02em;
}
.choix.qcm { font-size: clamp(1.6rem, 6vw, 3rem); line-height: 1.12; }
.rep {
  text-decoration: underline;
  text-decoration-thickness: 0.07em;
  text-underline-offset: 0.12em;
  transition: opacity 0.2s;
}
.rep:hover { text-decoration-thickness: 0.14em; }
.sep { opacity: 0.45; font-weight: 400; }
.fini .rep { cursor: default; text-decoration: none; }
.fini .rep.barre { opacity: 0.35; text-decoration: line-through; text-decoration-thickness: 0.09em; }
.fini .rep.bon { background: var(--texte); color: var(--fond); padding: 0 0.12em; box-decoration-break: clone; -webkit-box-decoration-break: clone; }

.suite { margin-top: 1.6em; max-width: 36rem; font-size: 1.25rem; line-height: 1.45; }
.suite[hidden] { display: none; }
.verdict { font-weight: 760; font-stretch: 80%; font-size: 1.6rem; margin: 0 0 0.3em; }
.suite p { margin: 0 0 0.9em; }
.saviez { font-style: normal; border-left: 3px solid currentColor; padding-left: 14px; }
.saviez b { display: block; font-weight: 700; }
.note { font-size: 1.0625rem; opacity: 0.85; }
.sources { font-size: 0.95rem; line-height: 1.4; margin-top: 1.4em; }
.sources a { font-weight: 600; text-underline-offset: 3px; }
.ensuite { margin-top: 2.2em; }
.ensuite p { margin: 0 0 0.4em; font-size: 1.1rem; font-weight: 500; }
.porte {
  display: block; text-align: left; margin: 0 0 0.25em;
  font-weight: 760; font-stretch: 78%; font-variation-settings: "opsz" 72;
  font-size: clamp(1.7rem, 6.4vw, 3.2rem); line-height: 1; letter-spacing: -0.02em;
  text-decoration: underline; text-decoration-thickness: 0.06em; text-underline-offset: 0.14em;
}
.porte:hover { text-decoration-thickness: 0.13em; }

dialog { border: 0; padding: 24px 18px; width: min(560px, 100%); max-height: 86svh; background: #fff; color: #000; }
dialog::backdrop { background: rgba(0,0,0,0.6); }
dialog h2 { margin: 0 0 12px; font-stretch: 76%; font-size: 2.2rem; line-height: 1; letter-spacing: -0.02em; }
dialog ol { margin: 0; padding-left: 1.3em; font-size: 1.1rem; line-height: 1.4; }
dialog button { margin-top: 18px; font-weight: 700; text-decoration: underline; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
</style>

<script>
const FAITS = [{"id":"cachalot","nom":"Maquette de cachalot","objet":"cachalot","porte":"Un géant des mers, et un malentendu","q":{"type":"qcm","texte":"Comment dit-on « cachalot » en anglais ?","choix":["Sperm whale","Killer whale","Pilot whale","Humpback whale"],"reponse":0,"explication":"Sperm whale. Les baleiniers prenaient le spermaceti, une substance huileuse contenue dans la tête de l'animal, pour du sperme. Le nom est resté."},"saviez":null,"note":null,"sources":[{"nom":"Encyclopædia Britannica","titre":"How Did the Sperm Whale Get Its Name?","url":"https://www.britannica.com/story/how-did-the-sperm-whale-get-its-name"}],"liens":[]},{"id":"droste","nom":"Boîte de cacao à l'infini","objet":"boite","porte":"Une image dans une image dans une image","q":{"type":"vf","texte":"L'effet Droste, cette image qui se répète à l'intérieur d'elle-même, doit son nom à une marque de cacao.","reponse":true,"explication":"Les boîtes de cacao Droste montraient une infirmière portant un plateau avec une tasse et une boîte identique, sur laquelle on retrouvait la même scène, et ainsi de suite. L'image date du début du XXe siècle ; le terme « effet Droste » a été popularisé à la fin des années 1970 par le chroniqueur néerlandais Nico Scheepmaker."},"saviez":"Giotto avait eu l'idée six siècles plus tôt : sur le triptyque Stefaneschi (début du XIVe siècle), le cardinal Stefaneschi est représenté en train d'offrir… le triptyque lui-même.","note":null,"sources":[{"nom":"Wikipédia (en)","titre":"Droste effect","url":"https://en.wikipedia.org/wiki/Droste_effect"},{"nom":"Aleteia","titre":"How a Dutch cocoa tin was inspired by a medieval altarpiece","url":"https://aleteia.org/2017/12/13/how-a-dutch-cocoa-tin-was-inspired-by-a-medieval-altarpiece/"}],"liens":[{"vers":"bosch","porte":"Un autre détail caché dans un tableau"}]},{"id":"bosch","nom":"Le Jardin des délices (copie)","objet":"tableau:jardin","porte":"Un détail que personne ne regarde","q":{"type":"vf","texte":"Dans Le Jardin des délices de Jérôme Bosch, une partition est peinte sur les fesses d'un personnage.","reponse":true,"explication":"Sur le panneau de l'Enfer, en bas à gauche, un damné porte une portée musicale sur le postérieur. Une étudiante américaine l'a transcrite et enregistrée, et le morceau a fait le tour d'Internet en 2014."},"saviez":null,"note":"Cette transcription est contestée : certains spécialistes de la musique ancienne estiment que la notation peinte par Bosch ne peut pas vraiment être déchiffrée.","sources":[{"nom":"Open Culture","titre":"Listen to a Recording of a Song Written on a Man's Butt in a Hieronymus Bosch Painting","url":"https://www.openculture.com/2014/02/song-written-on-mans-butt-in-bosch-painting.html"}],"liens":[{"vers":"bocklin","porte":"Un autre tableau qui hante les esprits"}]},{"id":"beksinski","nom":"Toile sans titre","objet":"tableau:beksinski","porte":"Des tableaux qui ne disent pas leur nom","q":{"type":"vf","texte":"Le peintre polonais Zdzisław Beksiński refusait de donner un titre à ses tableaux.","reponse":true,"explication":"Il ne nommait aucun de ses dessins ni de ses tableaux : selon lui, ses œuvres n'avaient pas à être expliquées. Il disait ne pas savoir lui-même ce qu'elles signifiaient, et ne pas s'intéresser aux interprétations."},"saviez":"Né en 1929 à Sanok, dans le sud de la Pologne, et mort en 2005 à Varsovie, il résumait sa démarche ainsi : « Je ne veux rien dire ni rien transmettre. Je peins simplement ce qui me vient à l'esprit. »","note":null,"sources":[{"nom":"Wikipédia (en)","titre":"Zdzisław Beksiński","url":"https://en.wikipedia.org/wiki/Zdzis%C5%82aw_Beksi%C5%84ski"}],"liens":[{"vers":"bocklin","porte":"Un autre paysage de fin du monde"}]},{"id":"bocklin","nom":"L'Île des morts (copie)","objet":"tableau:ile","porte":"Une île, un rameur, des cyprès","q":{"type":"vf","texte":"Arnold Böcklin n'a peint qu'une seule version de L'Île des morts.","reponse":false,"explication":"Il en a peint cinq, entre 1880 et 1886. Une sixième a été achevée en 1901 par son fils Carlo, avec lui. L'une des versions a été détruite à Berlin pendant la Seconde Guerre mondiale."},"saviez":"Hitler, admirateur de Böcklin, a acheté la version de 1883 en 1933 ; elle est aujourd'hui à l'Alte Nationalgalerie de Berlin. Rachmaninov a composé en 1909 un poème symphonique d'après une simple reproduction en noir et blanc du tableau.","note":null,"sources":[{"nom":"Wikipédia (en)","titre":"Isle of the Dead (painting)","url":"https://en.wikipedia.org/wiki/Isle_of_the_Dead_(painting)"}],"liens":[{"vers":"droste","porte":"Une image qui se contient elle-même"},{"vers":"beksinski","porte":"Un peintre qui refusait de s'expliquer"}]},{"id":"quebec","nom":"Cassette québécoise","objet":"vhs:bleu","porte":"Un titre qui ne passerait pas en France","q":{"type":"vf","texte":"Au Québec, la comédie Le Plus Escroc des deux (1988) est sortie sous le titre « Deux fils de pute ».","reponse":true,"explication":"Le film de Frank Oz, avec Steve Martin et Michael Caine, s'appelle Dirty Rotten Scoundrels en version originale. La France l'a rebaptisé Le Plus Escroc des deux ; au Québec, il est devenu « Deux fils de pute »."},"saviez":null,"note":null,"sources":[{"nom":"Mediafilm","titre":"Deux fils de pute (Dirty Rotten Scoundrels), de Frank Oz (1988)","url":"https://mediafilm.ca/films/1988/deux-fils-de-pute"},{"nom":"Wikipédia","titre":"Le Plus Escroc des deux","url":"https://fr.wikipedia.org/wiki/Le_Plus_Escroc_des_deux"}],"liens":[{"vers":"katerine","porte":"Un autre rôle inattendu au cinéma"},{"vers":"cage","porte":"Une autre histoire de cinéma"}]},{"id":"katerine","nom":"Bobine de Jim Queen","objet":"bobine:rose","porte":"Un rôle très particulier pour un chanteur","q":{"type":"qcm","texte":"Dans le film d'animation Jim Queen, quel rôle tient Philippe Katerine ?","choix":["Une prostate","Un chat de gouttière","Le maire de Paris","Un DJ"],"reponse":0,"explication":"Une prostate. Selon le coréalisateur Marco Nguyen, l'idée venait du producteur, et Katerine a accepté justement parce qu'il s'agissait d'une prostate."},"saviez":"Réalisé par Marco Nguyen et Nicolas Athané, Jim Queen suit un influenceur de la nuit gay parisienne qui contracte « l'hétérose », un virus qui rend les homosexuels hétérosexuels. Le film a été présenté au Festival de Cannes.","note":null,"sources":[{"nom":"Le Petit Septième","titre":"[Cannes] Jim Queen : Queentastic","url":"https://lepetitseptieme.ca/en/2026/05/20/cannes-jim-queen-queentastic/"},{"nom":"Politis","titre":"« Jim Queen », une prostate salutaire","url":"https://www.politis.fr/articles/2026/06/cinema-nguyen-athane-jim-queen-une-prostate-salutaire/"}],"liens":[{"vers":"quebec","porte":"Un titre de film très direct"}]},{"id":"cage","nom":"Bobine de film","objet":"bobine","porte":"Une histoire de famille à Hollywood","q":{"type":"vf","texte":"Nicolas Cage est le neveu de Francis Ford Coppola.","reponse":true,"explication":"Son père, August Coppola, est le frère de Francis Ford Coppola. Nicolas Cage est donc le cousin germain de la réalisatrice Sofia Coppola. Il est né Nicolas Coppola."},"saviez":null,"note":null,"sources":[{"nom":"Encyclopædia Britannica","titre":"How Is Sofia Coppola Related to Nicolas Cage?","url":"https://www.britannica.com/question/How-is-Sofia-Coppola-related-to-Nicolas-Cage"},{"nom":"Encyclopædia Britannica","titre":"Nicolas Cage","url":"https://www.britannica.com/biography/Nicolas-Cage"}],"liens":[{"vers":"trump","porte":"Un autre visage connu, là où on ne l'attend pas"}]},{"id":"trump","nom":"Cassette vidéo","objet":"vhs","porte":"Une apparition éclair dans un film de Noël","q":{"type":"vf","texte":"Donald Trump fait une apparition dans Maman, j'ai encore raté l'avion (1992).","reponse":true,"explication":"Il croise brièvement Kevin dans le hall de l'hôtel Plaza, qui lui appartenait à l'époque. Le réalisateur Chris Columbus a raconté que cette apparition était la condition pour pouvoir tourner dans l'hôtel."},"saviez":"Il fait aussi des apparitions dans Zoolander, Le Prince de Bel-Air et Sex and the City.","note":null,"sources":[{"nom":"South China Morning Post","titre":"Donald Trump's most memorable appearances in TV and film","url":"https://scmp.com/magazines/style/entertainment/article/3265462/donald-trumps-most-memorable-appearances-tv-and-film-sex-and-city-fresh-prince-bel-air-and-nanny"},{"nom":"The Irish Post","titre":"Home Alone 2 director says Donald Trump bullied his way into movie","url":"https://www.irishpost.com/news/home-alone-2-director-says-donald-trump-bullied-his-way-into-movie-197727"}],"liens":[{"vers":"cage","porte":"Une autre histoire de cinéma"}]},{"id":"tumbler","nom":"Boule de feu à pointes","objet":"boulefeu","porte":"Quelques millisecondes dans le désert du Nevada","q":{"type":"vf","texte":"Sur certaines photos d'essais nucléaires, des pointes sortent de la boule de feu à cause de simples câbles.","reponse":true,"explication":"C'est l'« effet rope trick ». La lumière intense de la boule de feu chauffe les haubans qui tiennent la tour de tir : ils se vaporisent et forment ces pointes. Il a été photographié notamment lors de l'opération Tumbler-Snapper, au Nevada, en 1952."},"saviez":"Ces images ont été prises avec des caméras rapatronic, conçues notamment par Harold Edgerton. Chaque caméra ne prenait qu'une seule photo, avec une exposition d'environ trois microsecondes : il fallait en aligner plusieurs pour obtenir une séquence.","note":"Le physicien John Malik, qui a nommé l'effet, a montré que des câbles peints en noir l'accentuaient, et que de la peinture réfléchissante ou de l'aluminium le faisaient disparaître.","sources":[{"nom":"Wikipédia (en)","titre":"Rope trick effect","url":"https://en.wikipedia.org/wiki/Rope_trick_effect"},{"nom":"Atomic Archive","titre":"Early Fireball","url":"https://www.atomicarchive.com/media/photographs/fireball/fireball-4.html"}],"liens":[{"vers":"femto","porte":"Des temps encore plus courts"}]},{"id":"femto","nom":"Chronomètre de précision","objet":"chrono","porte":"Une durée presque impossible à imaginer","q":{"type":"qcm","texte":"Une femtoseconde, c'est…","choix":["10⁻⁹ seconde","10⁻¹² seconde","10⁻¹⁵ seconde","10⁻¹⁸ seconde"],"reponse":2,"explication":"10⁻¹⁵ seconde, soit un millionième de milliardième de seconde. 10⁻⁹, c'est la nanoseconde, 10⁻¹² la picoseconde et 10⁻¹⁸ l'attoseconde."},"saviez":"Les préfixes « femto » et « atto » ont été ajoutés au Système international d'unités en 1964.","note":null,"sources":[{"nom":"BIPM (Bureau international des poids et mesures)","titre":"SI prefixes","url":"https://www.bipm.org/en/measurement-units/si-prefixes"},{"nom":"BIPM","titre":"Résolution 8 de la 12e Conférence générale des poids et mesures (1964)","url":"https://www.bipm.org/en/committees/cg/cgpm/12-1964/resolution-8"}],"liens":[]},{"id":"eigengrau","nom":"Nuancier du noir","objet":"livre:gris","porte":"La couleur du noir complet","q":{"type":"vf","texte":"Dans l'obscurité totale, l'œil voit un noir parfait.","reponse":false,"explication":"Il voit un gris très foncé, appelé eigengrau (« gris intrinsèque » en allemand). Même sans lumière, le nerf optique continue de transmettre des signaux : une sorte de bruit de fond visuel."},"saviez":"Un ciel nocturne paraît plus noir que l'eigengrau : les étoiles créent du contraste, et c'est le contraste qui guide notre perception.","note":null,"sources":[{"nom":"Vice","titre":"Quelle couleur voit-on dans le noir total ? L'eigengrau, évidemment","url":"https://www.vice.com/fr/article/quelle-couleur-voit-on-dans-le-noir-total-leigengrau-evidemment/"}],"liens":[]},{"id":"coucou","nom":"Nid avec un œuf de trop","objet":"nid","porte":"Un oiseau qui ne fait pas le travail lui-même","q":{"type":"vf","texte":"Le coucou gris couve lui-même ses œufs.","reponse":false,"explication":"Le coucou gris est un parasite de couvée : la femelle pond dans le nid d'autres espèces d'oiseaux, qui couvent l'œuf puis nourrissent le poussin comme s'il était le leur."},"saviez":null,"note":null,"sources":[{"nom":"INPN (Muséum national d'Histoire naturelle)","titre":"Cuculus canorus, coucou gris","url":"https://inpn.mnhn.fr/espece/cd_nom/3465"}],"liens":[{"vers":"hiboux","porte":"Un autre oiseau qui cache bien son jeu"}]},{"id":"hiboux","nom":"Hibou perché","objet":"hibou","porte":"Ce que cachent les plumes","q":{"type":"vf","texte":"Les hiboux ont de longues pattes, cachées sous leurs plumes.","reponse":true,"explication":"Ce qu'on voit d'un hibou, c'est surtout le bas de la patte et les serres : la cuisse et le genou sont cachés dans le plumage. Ces longues pattes servent à chasser : le hibou attrape ses proies avec les serres, ce qui garde sa tête et ses yeux à distance."},"saviez":"La chouette lapone ne pèse qu'environ 1,4 kg, mais elle pourrait percer une croûte de neige assez solide pour supporter une personne de 80 kg.","note":null,"sources":[{"nom":"American Bird Conservancy","titre":"Why Are Owl Legs So Long?","url":"https://abcbirds.org/news/why-are-owl-legs-so-long-the-science-behind-those-lengthy-bird-limbs/"}],"liens":[]},{"id":"zoubida","nom":"45 tours de 1991","objet":"vinyle:rose","porte":"Le tube de l'été 1991","q":{"type":"vf","texte":"La Zoubida de Lagaf' a été certifiée disque de platine.","reponse":true,"explication":"Sortie en mai 1991, la chanson a été certifiée disque de platine par le SNEP. Elle est restée onze semaines, non consécutives, en tête du classement français des singles."},"saviez":null,"note":null,"sources":[{"nom":"Wikipédia (en)","titre":"La Zoubida","url":"https://en.wikipedia.org/wiki/La_Zoubida"}],"liens":[{"vers":"around","porte":"Une autre chanson répétitive"}]},{"id":"around","nom":"Vinyle de Homework","objet":"vinyle:bleu","porte":"Une chanson de trois mots","q":{"type":"qcm","texte":"Combien de fois la phrase « Around the world » est-elle répétée dans le morceau de Daft Punk ?","choix":["44 fois","88 fois","144 fois","200 fois"],"reponse":2,"explication":"144 fois, selon le décompte le plus souvent cité pour la version de l'album Homework (1997). Ce sont les seules paroles du morceau."},"saviez":null,"note":"Les décomptes varient légèrement selon les versions (single, album, montage radio). 144 correspond à la version album.","sources":[{"nom":"Songfacts","titre":"Around The World by Daft Punk","url":"https://www.songfacts.com/facts/daft-punk/around-the-world"}],"liens":[]},{"id":"farriner","nom":"Miche de Pudding Lane","objet":"pain","porte":"Une boulangerie, une nuit de septembre","q":{"type":"vf","texte":"Le Grand Incendie de Londres, en 1666, est parti d'une boulangerie.","reponse":true,"explication":"Le feu démarre dans la boulangerie de Thomas Farriner, sur Pudding Lane. Ce boulanger était connu pour avoir fourni du pain à la Royal Navy."},"saviez":"Un horloger français, Robert Hubert, avoue avoir allumé l'incendie. Farriner et ses enfants signent l'acte d'accusation, et Hubert est pendu le 27 octobre 1666. Pourtant, le capitaine de son navire témoigne qu'il n'est arrivé en Angleterre que deux jours après le début du feu. Farriner meurt en 1670.","note":"Le rôle de Farriner dans l'accusation repose sur une transcription d'archives de la City de Londres, citée par la page Wikipédia qui lui est consacrée.","sources":[{"nom":"British Library","titre":"Robert Hubert and the Great Fire of London","url":"https://www.bl.uk/stories/blogs/posts/robert-hubert-and-the-great-fire-of-london"},{"nom":"Wikipédia (en)","titre":"Thomas Farriner","url":"https://en.wikipedia.org/wiki/Thomas_Farriner"}],"liens":[]},{"id":"melos","nom":"Colonne de Mélos","objet":"colonne","porte":"Une île qui voulait rester neutre","q":{"type":"vf","texte":"Au Ve siècle av. J.-C., Athènes a rasé une île parce qu'elle voulait rester neutre.","reponse":true,"explication":"En 416 av. J.-C., Athènes somme l'île de Mélos de se soumettre. Les Méliens refusent, plaident la neutralité et en appellent à la justice. Athènes assiège l'île, tue les hommes et réduit les femmes et les enfants en esclavage."},"saviez":"Thucydide reconstitue la négociation dans le « dialogue mélien ». Les Athéniens y expliquent que la justice ne vaut qu'entre égaux : les forts font ce qu'ils peuvent, les faibles subissent ce qu'ils doivent. Le texte est encore étudié en relations internationales.","note":"Selon Thucydide, Mélos était une colonie fondée par Sparte, ce qui explique la méfiance d'Athènes. Une île, donc, et non Sparte elle-même.","sources":[{"nom":"Encyclopædia Britannica","titre":"Melian Dialogue","url":"https://www.britannica.com/topic/Melian-Dialogue"},{"nom":"Thucydide","titre":"La Guerre du Péloponnèse, livre V, chapitres 84 à 116","url":null}],"liens":[]},{"id":"cerveau","nom":"Cerveau en bocal","objet":"cerveau","porte":"L'organe le plus gourmand du corps","q":{"type":"vf","texte":"On n'utilise que 10 % de notre cerveau.","reponse":false,"explication":"Les neurologues interrogés par Scientific American sont formels : on utilise pratiquement toutes les parties du cerveau. L'imagerie montre que la plupart des régions sont actives au cours d'une journée, même pendant le sommeil."},"saviez":"Le cerveau représente environ 3 % du poids du corps, mais il consomme environ 20 % de son énergie. L'origine du mythe reste floue : on la rattache parfois aux écrits du psychologue William James, et on l'attribue aussi à Einstein, sans preuve.","note":null,"sources":[{"nom":"Scientific American","titre":"Do People Only Use 10 Percent of Their Brains?","url":"https://www.scientificamerican.com/article/do-people-only-use-10-percent-of-their-brains/"}],"liens":[]},{"id":"requins","nom":"Dent de requin fossile","objet":"dent","porte":"Un prédateur très, très ancien","q":{"type":"vf","texte":"Les requins existent depuis plus longtemps que les arbres.","reponse":true,"explication":"Les plus anciennes traces de requins sont des écailles vieilles d'environ 450 millions d'années. La plus ancienne forêt fossile connue, découverte à Cairo, dans l'État de New York, a environ 386 millions d'années."},"saviez":"Cette forêt fossile a été retrouvée dans une ancienne carrière de grès des monts Catskill. On y distingue encore les systèmes racinaires de ces arbres primitifs.","note":"Les écailles de 450 millions d'années font débat : on ne sait pas avec certitude s'il s'agit de vrais requins. Mais même les plus vieilles dents de type requin connues, celles de Doliodus problematicus (environ 410 millions d'années), sont plus anciennes que cette forêt.","sources":[{"nom":"Natural History Museum, Londres","titre":"Shark evolution: a 450-million-year timeline","url":"https://www.nhm.ac.uk/discover/shark-evolution-a-450-million-year-timeline"},{"nom":"Yale Environment 360","titre":"Scientists Find the World's Oldest Known Forest, Dating Back 386 Million Years (étude parue dans Current Biology, 2019)","url":"https://e360.yale.edu/digest/scientists-find-the-worlds-oldest-known-forest-dating-back-386-million-years"}],"liens":[]}];
const par = Object.fromEntries(FAITS.map((f) => [f.id, f]));
const PALETTE = [
  ["#FF5A36", "#000"], ["#B9A6FF", "#000"], ["#FFD23F", "#000"], ["#7FD8BE", "#000"],
  ["#FF9EC7", "#000"], ["#3D5AFE", "#fff"], ["#111111", "#FFD23F"],
];
const vus = [];
let n = 0;
const fil = document.getElementById("fil");
const melange = (a) => a.map((x) => [Math.random(), x]).sort((p, q) => p[0] - q[0]).map((p) => p[1]);
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };

function majTrouves() {
  const b = document.getElementById("trouves");
  b.textContent = `${n} trouvé${n > 1 ? "s" : ""}`;
}
document.getElementById("trouves").onclick = () => {
  const ol = document.getElementById("ol");
  ol.replaceChildren(...vus.map((id) => el("li", null, par[id].q.texte)));
  document.getElementById("liste").showModal();
};

function portes(f) {
  const reste = FAITS.filter((x) => !vus.includes(x.id));
  const res = [];
  for (const l of f.liens) { const c = reste.find((x) => x.id === l.vers); if (c && res.length < 2) res.push([c, l.porte]); }
  for (const c of melange(reste)) { if (res.length >= 2) break; if (!res.some((r) => r[0].id === c.id)) res.push([c, c.porte]); }
  return res;
}

function afficher(id, premier) {
  const f = par[id];
  vus.push(id);
  const [fond, texte] = PALETTE[(vus.length - 1) % PALETTE.length];
  const s = el("section", "bande");
  s.style.setProperty("--fond", fond);
  s.style.setProperty("--texte", texte);
  const h = el("h1", "fait", f.q.texte);
  h.tabIndex = -1;
  const choix = el("p", "choix" + (f.q.type === "qcm" ? " qcm" : ""));
  const opts = f.q.type === "vf" ? [["Vrai", true], ["Faux", false]] : f.q.choix.map((c, i) => [c, i]);
  opts.forEach(([lib, val], i) => {
    const b = el("button", "rep", lib);
    b.type = "button";
    b.onclick = () => repondre(f, s, choix, b, val);
    b.dataset.v = String(val);
    choix.append(b);
    if (i < opts.length - 1) choix.append(el("span", "sep", f.q.type === "vf" ? " ou " : i === opts.length - 2 ? " ou " : ", "));
  });
  if (f.q.type === "qcm") choix.append(el("span", "sep", " ?"));
  const suite = el("div", "suite");
  suite.hidden = true;
  s.append(h, choix, suite);
  fil.append(s);
  if (!premier) {
    s.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
    h.focus({ preventScroll: true });
  }
}

function repondre(f, s, choix, b, val) {
  if (choix.classList.contains("fini")) return;
  choix.classList.add("fini");
  const juste = val === f.q.reponse;
  for (const x of choix.querySelectorAll(".rep")) {
    const v = x.dataset.v === "true" ? true : x.dataset.v === "false" ? false : Number(x.dataset.v);
    x.classList.add(v === f.q.reponse ? "bon" : "barre");
    x.disabled = true;
  }
  n++;
  majTrouves();
  const suite = s.querySelector(".suite");
  suite.append(el("p", "verdict", juste ? "Bien vu." : "Raté."), el("p", null, f.q.explication));
  if (f.saviez) { const p = el("p", "saviez"); p.append(el("b", null, "Le saviez-vous ?"), document.createTextNode(f.saviez)); suite.append(p); }
  if (f.note) suite.append(el("p", "note", "Note de vérification : " + f.note));
  const src = el("p", "sources");
  src.append(document.createTextNode(f.sources.length > 1 ? "Sources : " : "Source : "));
  f.sources.forEach((x, i) => {
    const a = x.url ? Object.assign(el("a", null, x.nom), { href: x.url, target: "_blank", rel: "noopener" }) : el("span", null, x.nom);
    src.append(a, document.createTextNode(` (${x.titre})${i < f.sources.length - 1 ? ", " : "."}`));
  });
  suite.append(src);
  const ens = el("div", "ensuite");
  const ps = portes(f);
  ens.append(el("p", null, ps.length ? "Et ensuite :" : "Tu as tout vu."));
  for (const [c, lib] of ps) {
    const p = el("button", "porte", lib);
    p.type = "button";
    p.onclick = () => { ens.querySelectorAll(".porte").forEach((x) => (x.disabled = true)); afficher(c.id); };
    ens.append(p);
  }
  suite.append(ens);
  suite.hidden = false;
}

afficher(melange(["cachalot", "quebec", "bosch", "eigengrau", "katerine"])[0], true);
majTrouves();
</script>
</body>
</html>
